spring:
  application:
    name: NotiFi-Server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # .env 를 환경 변수처럼 읽는다. docker compose 는 env_file 로 이미 주입하지만
  # gradlew bootRun / IntelliJ 실행은 .env 를 읽지 않아 기본값으로 떨어졌다.
  # OS 환경 변수가 config import 보다 우선순위가 높으므로 컨테이너 동작은 그대로다.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifi}
    username: ${DB_USERNAME:notifi}
    password: ${DB_PASSWORD:notifi}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:notifi-secret-key-for-local-dev-only-change-in-prod!}
  access-token-ttl: ${JWT_ACCESS_TTL:3600}
  refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  # 노인 계정 전용. 보호자는 로그아웃돼도 이메일·비밀번호로 다시 들어오지만,
  # 노인은 그 자격증명을 모르는 것이 정상이라 세션이 끊기면 보호자가 연결코드를
  # 새로 발급해 줄 때까지 음성 확인에 응답할 수 없다. 기본 90일.
  recipient-refresh-token-ttl: ${JWT_RECIPIENT_REFRESH_TTL:7776000}

internal:
  api-key: ${INTERNAL_API_KEY:change-me-before-deploy}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

invite:
  code-ttl: ${INVITE_CODE_TTL:86400}
  link-base-url: ${INVITE_LINK_BASE_URL:https://app.bloom-safety.app/invite}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
    # Swagger는 인증 없이 열린다(SecurityConfig 기본 체인). API 전체 구조가 공개되므로
    # 배포 환경에선 기본 차단하고 필요할 때만 켠다 — prod 프로파일 블록 참고.
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  packages-to-scan: com.notifi.server.domain

logging:
  level:
    com.notifi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 치명 실패 알림 웹훅 (Discord·Slack 등). 미설정이면 비활성 — 로컬 개발이 막히지 않는다.
alert:
  webhook-url: ${ALERT_WEBHOOK_URL:}
  environment: ${ALERT_ENVIRONMENT:local}

---
# ── prod 프로파일 ──────────────────────────────────────────────────────────
# 로컬과 다른 것만 여기 둔다. 시크릿 검증은 ProdConfigGuard가 부팅 시 수행한다.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      # 사람이 읽는 평문 대신 ECS(Elastic Common Schema) JSON 한 줄로 출력한다.
      # 수집기가 파싱할 수 있어야 하고, AI 서버도 JSON을 내므로 포맷을 맞춘다.
      # traceId는 MDC에서 자동으로 실린다.
      console: ecs
    ecs:
      service:
        name: notifi-server

springdoc:
  api-docs:
    # 배포 환경 기본은 차단. 켜려면 SWAGGER_ENABLED=true 를 명시한다.
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

alert:
  # 기본값을 뒤집는다 — 안 그러면 운영 장애 알림이 "[local]"로 도착해
  # 여러 환경을 한 채널로 받을 때 어디서 난 장애인지 오판하게 된다.
  environment: ${ALERT_ENVIRONMENT:prod}
